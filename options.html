<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Claude Voice Bridge – Beállítások</title><link rel="stylesheet" href="ui.css"></head><body><main><h1>Claude Voice Bridge</h1><p>Privát PoC. A beszéd és Claude felolvasott válaszai a Gemini API-hoz kerülnek. Ne küldj érzékeny tartalmat!</p><form id="settings"><label>Gemini API-kulcs<input id="apiKey" type="password" autocomplete="off" placeholder="AIza…" required></label><label>STT modell<input id="sttModel" required></label><label>TTS modell<input id="ttsModel" required></label><label>TTS hang<input id="voice" required></label><label>Stílusutasítás<input id="style"></label><label>Felvétel utáni küldés<select id="sendMode"><option value="auto">Automatikus</option><option value="confirm">Megerősítést kérek</option></select></label><label>Beszéd vége, csend (ms)<input id="silenceMs" type="number" min="700" max="2500" step="100"></label><label>Napi STT-korlát (perc)<input id="maxMinutes" type="number" min="1" max="1000"></label><label>Napi TTS-korlát (karakter)<input id="maxChars" type="number" min="100" max="1000000"></label><label>Szótár (soronként egy kifejezés)<textarea id="vocabulary" rows="5"></textarea></label><button type="submit">Mentés</button><button type="button" id="checkMicrophone">Mikrofon ellenőrzése</button><span role="status" id="status"></span></form><p class="hint">A felvételhez a claude.ai lap mikrofonengedélye szükséges. A bővítmény nem kér Claude API-kulcsot.</p></main><script src="options.js"></script></body></html>
