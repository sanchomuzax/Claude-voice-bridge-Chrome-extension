name: Tesztelés és GitHub Release
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Windows updater Python security/installer tests
        run: python3 -m unittest discover -s native -p 'test_*.py' -v
      - run: npm run audit:secrets
      - name: Valós mobil hit-test (chat és menük kattinthatósága)
        run: node scripts/test-mobile-hit-targets.mjs
      - name: Friss HUD-kép generálása a tényleges panelből
        run: |
          node --check scripts/render-hud-preview.mjs
          node scripts/render-hud-preview.mjs
          node --check scripts/render-popup-preview.mjs
          node scripts/render-popup-preview.mjs
          test -s docs/images/hud-v055-preview.png
          test -s docs/images/popup-v059-preview.png
      - name: Friss kép mentése az ágba
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/images/hud-v055-preview.png docs/images/popup-v059-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: render new labeled HUD image [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: npm run build
      - name: Telepíthető csomag létrehozása
        id: archive
        run: |
          npm run pack
          VERSION=$(node -p "require('./package.json').version")
          echo "name=Claude-Voice-Bridge-v$VERSION.zip" >> "$GITHUB_OUTPUT"
      - name: ZIP integritás
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP="Claude-Voice-Bridge-v$VERSION.zip"
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$ZIP.sha256"
          test -s "$ZIP.sha256"
          test -s vendor/silero_vad_v5.onnx
          test -s vendor/vad.worklet.bundle.min.js
      - uses: actions/upload-artifact@v4
        with:
          name: "Claude-Voice-Bridge-${{ github.sha }}"
          path: ${{ steps.archive.outputs.name }}
          if-no-files-found: error
      - name: Automatikus kiadás a GitHub Releases menüben
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ZIP="Claude-Voice-Bridge-v$VERSION.zip"
          TAG="v$VERSION"
          NOTES=".github/release-notes/$TAG.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" --target "$GITHUB_SHA" --title "Claude Voice Bridge $TAG" --notes-file "$NOTES" --latest
          fi
          while IFS="|" read -r OLD SHA DESC; do
            FILE="Claude-Voice-Bridge-$OLD.zip"
            if [[ -s "$FILE" ]] && ! gh release view "$OLD" >/dev/null 2>&1; then
              if ! gh release create "$OLD" "$FILE" --target "$SHA" --title "Claude Voice Bridge $OLD" --notes "$DESC" --latest=false; then
                echo "::warning::Régebbi Release most nem hozható létre: $OLD. Az archivált ZIP megmarad a repóban."
              fi
            fi
          done <<'RELEASES'
          v0.1.0|5c5557a24382a18433a433d8ae98f885fcfaf546|Első magyar STT/TTS és kézi mikrofonkezelés a claude.ai webes felületén.
          v0.2.0|594ab9a82551a605cb7989d02dc38fc91adf4bda|Silero VAD, automata beszédvég-érzékelés, half-duplex feldolgozás és helyi ONNX/WASM modell.
          v0.3.0|f5802ba99b1f9fee0866b5f16f0723e2b61eb715|Claude-dizájn, becsukható panel, hangjelzések, csúszkák és Google modell-/hanglista.
          v0.3.1|9882efdac687a574ca1052c4b8f62127a3feee4d|A becsukott mobilpanel füle lejjebb került.
          RELEASES
      - name: Repo About / Topics / publikus láthatóság (jogosultság esetén)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY" -f description="Magyar hangos Claude-chat Gemini STT/TTS és Silero VAD segítségével." -f homepage="https://github.com/sanchomuzax/Claude-voice-bridge-Chrome-extension/releases/latest" >/dev/null; then
            echo "::warning::A GitHub Actions token nem jogosult a repo About módosítására. Tulajdonosi Settings szükséges."
          fi
          if ! printf '{"names":["claude","gemini","chrome-extension","quetta","hungarian","speech-to-text","text-to-speech","silero-vad"]}' | gh api --method PUT "repos/$GITHUB_REPOSITORY/topics" -H "Accept: application/vnd.github+json" --input - >/dev/null; then
            echo "::warning::A topics szerkesztéséhez tulajdonosi jogosultság kell."
          fi
          if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY" -f visibility=public >/dev/null; then
            echo "::warning::A repó nyilvánossá tételéhez a tulajdonos GitHub Settings / Danger Zone művelete szükséges."
          fi
