name: Összevont PR fejlesztési ágának automatikus törlése
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Csak a sikeresen összevont, változatlan fejlesztési ág törlése
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$(jq -r '.pull_request.head.repo.full_name' "$GITHUB_EVENT_PATH")"
          [[ "$repo" == "$GITHUB_REPOSITORY" ]] || exit 0
          branch="$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")"
          expected="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          [[ "$branch" != "main" && "$branch" != "master" ]] || exit 0

          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -z "$current" ]]; then
            echo "Az ág már nincs meg: $branch"
            exit 0
          fi
          if [[ "$current" != "$expected" ]]; then
            echo "::warning::Az ág időközben változott; megtartva: $branch"
            exit 0
          fi
          opened="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f "head=$GITHUB_REPOSITORY_OWNER:$branch" --jq 'length')"
          if [[ "$opened" != "0" ]]; then
            echo "::warning::Másik nyitott PR használja az ágat: $branch"
            exit 0
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
          echo "Összevont ág törölve: $branch"
